version: '3.8'

networks:
  paytrack-network:
    driver: bridge

volumes:
  mysql_auth_data:
  mysql_wallet_data:
  mysql_transaction_data:
  mysql_expense_data:
  redis_data:
  rabbitmq_data:

services:
  # ==========================================
  # Infrastructure Services
  # ==========================================

  mysql-auth:
    image: mysql:8.0
    container_name: paytrack-mysql-auth
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: paytrack_auth
      MYSQL_USER: paytrack
      MYSQL_PASSWORD: paytrack123
    ports:
      - "3307:3306"
    volumes:
      - mysql_auth_data:/var/lib/mysql
    networks:
      - paytrack-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5

  mysql-wallet:
    image: mysql:8.0
    container_name: paytrack-mysql-wallet
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: paytrack_wallet
      MYSQL_USER: paytrack
      MYSQL_PASSWORD: paytrack123
    ports:
      - "3308:3306"
    volumes:
      - mysql_wallet_data:/var/lib/mysql
    networks:
      - paytrack-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5

  mysql-transaction:
    image: mysql:8.0
    container_name: paytrack-mysql-transaction
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: paytrack_transaction
      MYSQL_USER: paytrack
      MYSQL_PASSWORD: paytrack123
    ports:
      - "3309:3306"
    volumes:
      - mysql_transaction_data:/var/lib/mysql
    networks:
      - paytrack-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5

  mysql-expense:
    image: mysql:8.0
    container_name: paytrack-mysql-expense
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: paytrack_expense
      MYSQL_USER: paytrack
      MYSQL_PASSWORD: paytrack123
    ports:
      - "3310:3306"
    volumes:
      - mysql_expense_data:/var/lib/mysql
    networks:
      - paytrack-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: paytrack-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - paytrack-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: paytrack-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - paytrack-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ==========================================
  # Microservices
  # ==========================================

  eureka-service:
    image: paytrack-eureka:latest
    build:
      context: ./backend/eureka-service
      dockerfile: Dockerfile
    container_name: paytrack-eureka
    restart: always
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-service:8761/eureka/
    networks:
      - paytrack-network
    ports:
      - "8761:8761"

  api-gateway-service:
    image: paytrack-gateway:latest
    build:
      context: ./backend/api-gateway-service
      dockerfile: Dockerfile
    container_name: paytrack-gateway
    restart: always
    depends_on:
      - eureka-service
    environment:
      SERVER_PORT: 8089
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-service:8761/eureka/
      SPRING_RABBITMQ_HOST: rabbitmq
      GATEWAY_SECRET: paytrack-internal-gateway-secret-2026
      JWT_SECRET: a2V5LWlzLWEtc2VjcmV0LWZvci1obGQtand0LXNpZ25pbmctdHdvLWh1bmRyZWQtYml0cy1sb25nLXNlY3JldA==
    networks:
      - paytrack-network
    ports:
      - "8089:8089"

  auth-service:
    image: paytrack-auth:latest
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: paytrack-auth
    restart: always
    depends_on:
      - eureka-service
      - mysql-auth
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-auth:3306/paytrack_auth?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: paytrack
      SPRING_DATASOURCE_PASSWORD: paytrack123
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_DATA_REDIS_HOST: redis
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-service:8761/eureka/
      GATEWAY_SECRET: paytrack-internal-gateway-secret-2026
      INTERNAL_API_KEY: paytrack-internal-api-key-2026
      JWT_SECRET: a2V5LWlzLWEtc2VjcmV0LWZvci1obGQtand0LXNpZ25pbmctdHdvLWh1bmRyZWQtYml0cy1sb25nLXNlY3JldA==
    networks:
      - paytrack-network
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  wallet-service:
    image: paytrack-wallet:latest
    build:
      context: ./backend/wallet-service
      dockerfile: Dockerfile
    container_name: paytrack-wallet
    restart: always
    depends_on:
      - eureka-service
      - mysql-wallet
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-wallet:3306/paytrack_wallet?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: paytrack
      SPRING_DATASOURCE_PASSWORD: paytrack123
      SPRING_RABBITMQ_HOST: rabbitmq
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-service:8761/eureka/
      GATEWAY_SECRET: paytrack-internal-gateway-secret-2026
      INTERNAL_API_KEY: paytrack-internal-api-key-2026
    networks:
      - paytrack-network
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  transaction-service:
    image: paytrack-transaction:latest
    build:
      context: ./backend/transaction-service
      dockerfile: Dockerfile
    container_name: paytrack-transaction
    restart: always
    depends_on:
      - eureka-service
      - mysql-transaction
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-transaction:3306/paytrack_transaction?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: paytrack
      SPRING_DATASOURCE_PASSWORD: paytrack123
      SPRING_RABBITMQ_HOST: rabbitmq
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-service:8761/eureka/
      GATEWAY_SECRET: paytrack-internal-gateway-secret-2026
      INTERNAL_API_KEY: paytrack-internal-api-key-2026
    networks:
      - paytrack-network
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  expense-service:
    image: paytrack-expense:latest
    build:
      context: ./backend/expense-service
      dockerfile: Dockerfile
    container_name: paytrack-expense
    restart: always
    depends_on:
      - eureka-service
      - mysql-expense
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-expense:3306/paytrack_expense?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: paytrack
      SPRING_DATASOURCE_PASSWORD: paytrack123
      SPRING_RABBITMQ_HOST: rabbitmq
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-service:8761/eureka/
      GATEWAY_SECRET: paytrack-internal-gateway-secret-2026
      INTERNAL_API_KEY: paytrack-internal-api-key-2026
    networks:
      - paytrack-network
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: paytrack-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: paytrack-frontend
    restart: always
    depends_on:
      - api-gateway-service
    environment:
      VITE_API_GATEWAY_URL: http://api-gateway-service:8089
    networks:
      - paytrack-network
    ports:
      - "3000:80"

