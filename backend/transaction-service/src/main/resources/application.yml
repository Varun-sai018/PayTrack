server:
  port: 8083

spring:
  application:
    name: transaction-service
  datasource:
    url: jdbc:mysql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:3306}/${SPRING_DATASOURCE_NAME:paytrack_transaction}?createDatabaseIfNotExist=true
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    generate-ddl: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest

gateway:
  secret: ${GATEWAY_SECRET:paytrack-internal-gateway-secret-2026}

internal:
  api:
    key: ${INTERNAL_API_KEY:paytrack-internal-api-key-2026}

paytrack:
  currency: INR
  timezone: Asia/Kolkata
  limits:
    min-amount: 1.00
    max-transaction: 10000.00
    daily-total: 25000.00
  recharge:
    min: 10.00
    max: 2000.00

resilience4j:
  circuitbreaker:
    instances:
      wallet-service-cb:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
  timelimiter:
    instances:
      wallet-service-cb:
        timeoutDuration: 3s

logging:
  level:
    com.paytrack.transaction: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

eureka:
  instance:
    hostname: eureka-service
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
