server:
  port: 8082

spring:
  application:
    name: wallet-service

  datasource:
    url: jdbc:mysql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:3306}/${SPRING_DATASOURCE_NAME:paytrack_wallet}?createDatabaseIfNotExist=true
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    generate-ddl: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest

gateway:
  secret: ${GATEWAY_SECRET:paytrack-internal-gateway-secret-2026}

internal:
  api:
    key: ${INTERNAL_API_KEY:paytrack-internal-api-key-2026}

paytrack:
  currency: INR
  gateway:
    key-id: sandbox_key_paytrack_2026
    key-secret: ${GATEWAY_KEY_SECRET:paytrack-gateway-hmac-secret-2026}

logging:
  level:
    com.paytrack.wallet: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

eureka:
  instance:
    hostname: eureka-service
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
